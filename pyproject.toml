[project]
name = "robotic"
version = "0.1.0"
description = "Hand-implemented robot kinematics for studying and verifying robotics exam exercises."
readme = "README.md"
authors = [{ name = "haislich", email = "josedlv936@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "jax>=0.12.0.1",
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=2.2.3",
    "pydantic>=2.14.1",
    "sympy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ast-grep-cli==0.51.0",
    "hypothesis>=6.170.6",
    "pandas-stubs>=2.2.3.250308",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "roboticstoolbox-python>=1.4.4",
    "ruff==0.17.2",
    "ty==0.0.91",
]
notebooks = [
    "ipykernel>=7.4.0",
    "ipympl>=0.10.0",
    "polars>=2.0.0",
]

[tool.uv]
default-groups = "all"

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["COM812", "CPY001"]

[tool.ruff.lint.per-file-ignores]
".claude/hooks/*.py" = ["INP001", "S404", "S603"]
"tests/**" = ["D1", "S101", "TID251"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
ignore-names = ["J", "R", "T"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"roboticstoolbox".msg = "Oracle library: import it only from tests/."
"spatialmath".msg = "Oracle library: import it only from tests/."

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
respect-type-ignore-comments = false
strict-equality-semantics = true
strict-generic-narrowing = true
